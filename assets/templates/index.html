{{safe (yocaml_body) }}

{% if has_articles %}
<h1 id="posts">Posts</h1>

<ul id="posts__list">
  {% for article in articles %}
  <li>
    <time>{{ article.date.repr.date}}</time>
    <a href="{{ article.url }}">{{ article.title }}</a>
    <blockquote cite="{{ article.url }}"><p>{{ article.description }}</p></blockquote>
  </li>
  {% endfor %}
</ul>

{% else %}

<p>There are no articles</p>

{% endif %}

name: Build & Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v6

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          dune-cache: true
          ocaml-compiler: 5

      - name: Install deps
        run: opam install . --deps-only -y

      - name: Cache Homepage
        id: cache-primes
        uses: actions/cache@v6
        with:
          path: _www
          key: ${{ runner.os }}-www

      - name: Build
        id: build
        run: |
            opam exec -- dune build
            opam exec -- dune exec bin/homepage.exe

      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _www/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
